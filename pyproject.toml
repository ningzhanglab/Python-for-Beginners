[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "python-for-beginners"
version = "0.1.0"
description = "Applied Python for economics and social science beginners"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pyarrow>=17",
  "seaborn>=0.13",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "nbformat>=5.10", "nbclient>=0.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/pss_helpers"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
