name: Course build and Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: quarto-dev/quarto-actions/setup@v2.2.0
        with:
          version: 1.11.9
      - name: Install the course environment
        run: python -m pip install -r requirements.txt
      - name: Check build safeguards
        run: python -m unittest discover -s tests -v
      - name: Execute lessons, build the site and check local links
        run: python scripts/build.py
      - name: Upload reviewable site
        uses: actions/upload-artifact@v7.0.2
        with:
          name: course-site
          path: _site/
          retention-days: 14
      - name: Package Pages output
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read owner-enabled Pages configuration
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: false
      - name: Deploy the checked site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
