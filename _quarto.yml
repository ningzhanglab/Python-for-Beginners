project:
  type: website
  output-dir: _site
  execute-dir: project
  render:
    - index.qmd
    - about.qmd
    - lessons/index.qmd
    - lessons/**/*.ipynb
    - projects/index.qmd
    - reference/index.qmd
  pre-render: python scripts/prepare_site.py
  resources:
    - downloads/
    - data/*.csv

website:
  title: "Python for Beginners"
  description: "A free, self-paced Python course for economics and social sciences. Start in your browser."
  site-url: https://ningzhanglab.github.io/Python-for-Beginners/
  repo-url: https://github.com/ningzhanglab/Python-for-Beginners
  repo-actions: [issue]
  page-navigation: true
  back-to-top-navigation: true
  search:
    location: navbar
    type: overlay
  navbar:
    background: light
    left:
      - text: Start here
        href: lessons/00-start/02-first-notebook.ipynb
      - text: Lessons
        href: lessons/index.qmd
      - projects/index.qmd
      - reference/index.qmd
      - about.qmd
  sidebar:
    style: docked
    collapse-level: 2
    contents:
      - lessons/index.qmd
      - section: "Part 0 · Start here"
        contents:
          - lessons/00-start/01-what-python-is-for.ipynb
          - lessons/00-start/02-first-notebook.ipynb
          - lessons/00-start/03-how-to-learn.ipynb
      - section: "Part 1 · Python basics"
        contents:
          - lessons/01-basics/01-values-variables.ipynb
          - lessons/01-basics/02-lists-dictionaries.ipynb
          - lessons/01-basics/03-decisions-repetition.ipynb
          - lessons/01-basics/04-functions.ipynb
          - lessons/01-basics/05-reading-errors.ipynb
          - lessons/01-basics/06-importing-libraries.ipynb
      - section: "Part 2 · Working with data"
        contents:
          - lessons/02-data/01-loading-data.ipynb
          - lessons/02-data/02-selecting.ipynb
          - lessons/02-data/03-transforming.ipynb
          - lessons/02-data/04-missing-types.ipynb
          - lessons/02-data/05-group-summaries.ipynb
          - lessons/02-data/06-combining.ipynb
          - lessons/02-data/07-reshaping.ipynb
          - lessons/02-data/08-dates-time-series.ipynb
      - text: "Part 3 · Visualization · coming soon"
      - text: "Part 4 · Statistics and regression · coming soon"
      - text: "Part 5 · Reproducible workflow · coming soon"
      - text: "Part 6 · Projects · coming soon"
        href: projects/index.qmd
      - reference/index.qmd
  page-footer:
    left: "Ning Zhang · Economics & social sciences"
    right: "Course in development · License undecided"

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    toc: true
    toc-title: On this page
    code-copy: true
    code-overflow: scroll
    lang: en

jupyter: python3
execute:
  enabled: true
  error: false
  cache: false
  freeze: false
  daemon: false
